services:
  node:
    container_name: bookridge-node
    build: .
    ports:
      - "3001:3000"
    env_file:
      - .env
    restart: always
    depends_on:
      - mysql
    networks:
      - bookridge-network

  mysql:
    container_name: bookridge-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Seoul
      LANG: C.UTF-8
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bookridge-network

networks:
  bookridge-network:
    driver: bridge

volumes:
  mysql-data:
